; =====================================================================
; Radio Mundial ESP32 — configuración de PlatformIO
;
; Entornos:
;   pc     -> simulador en el ordenador (LVGL + SDL2, el ratón hace de dedo)
;   esp32  -> placa Freenove FNK0104 (se activará en la Fase 1)
;
; Compilar y ejecutar el simulador:
;   pio run -e pc -t exec
; =====================================================================

[platformio]
default_envs = pc

; ---------------------------------------------------------------------
; Ajustes comunes a todos los entornos
; ---------------------------------------------------------------------
[env]
; LVGL 8.4.0: la misma versión que usan los ejemplos oficiales de Freenove
lib_deps =
    lvgl/lvgl@8.4.0
    bblanchon/ArduinoJson@7.2.1   ; lectura de regiones.json y emisoras
build_flags =
    -D LV_CONF_INCLUDE_SIMPLE   ; LVGL busca "lv_conf.h" en las rutas de include
    -D LV_LVGL_H_INCLUDE_SIMPLE ; las fuentes generadas incluyen "lvgl.h"
    -I include

; ---------------------------------------------------------------------
; Simulador en el PC
; Requisitos en Windows: MSYS2 con gcc y SDL2 (paquetes
; mingw-w64-ucrt-x86_64-gcc y mingw-w64-ucrt-x86_64-SDL2), y la carpeta
; C:\msys64\ucrt64\bin en el PATH.
; ---------------------------------------------------------------------
[env:pc]
platform = native
build_flags =
    ${env.build_flags}
    -D RADIO_PC                 ; marca que estamos compilando para el PC
    -D SDL_MAIN_HANDLED         ; usamos nuestro propio main()
    -lSDL2
; En el PC no se compila el código específico de la placa
build_src_filter =
    +<*>
    -<hal/esp32/>

; ---------------------------------------------------------------------
; Placa Freenove FNK0104 (pendiente: Fase 1)
; ---------------------------------------------------------------------
; [env:esp32]
; platform = espressif32
; board = ...
; framework = arduino
; build_src_filter = +<*> -<hal/pc/>
