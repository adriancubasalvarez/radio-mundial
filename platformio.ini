; =====================================================================
; Radio Mundial ESP32 — configuración de PlatformIO
;
; Entornos:
;   pc     -> simulador en el ordenador (LVGL + SDL2, el ratón hace de dedo)
;   cyd    -> CYD Freenove FNK0114F (placa provisional, sin PSRAM)
;   fnk0104 -> placa Freenove FNK0104 (ESP32-S3 con PSRAM)
;
; Compilar y ejecutar el simulador:
;   pio run -e pc -t exec
; =====================================================================

[platformio]
default_envs = pc

; ---------------------------------------------------------------------
; Ajustes comunes a todos los entornos
; ---------------------------------------------------------------------
[env]
; LVGL 8.4.0: la misma versión que usan los ejemplos oficiales de Freenove
lib_deps =
    lvgl/lvgl@8.4.0
    bblanchon/ArduinoJson@7.2.1   ; lectura de regiones.json y emisoras
build_flags =
    -D LV_CONF_INCLUDE_SIMPLE   ; LVGL busca "lv_conf.h" en las rutas de include
    -D LV_LVGL_H_INCLUDE_SIMPLE ; las fuentes generadas incluyen "lvgl.h"
    -I include

; ---------------------------------------------------------------------
; Simulador en el PC
; Requisitos en Windows: MSYS2 con gcc y SDL2 (paquetes
; mingw-w64-ucrt-x86_64-gcc y mingw-w64-ucrt-x86_64-SDL2), y la carpeta
; C:\msys64\ucrt64\bin en el PATH.
; ---------------------------------------------------------------------
[env:pc]
platform = native
build_flags =
    ${env.build_flags}
    -D RADIO_PC                 ; marca que estamos compilando para el PC
    -D SDL_MAIN_HANDLED         ; usamos nuestro propio main()
    -lSDL2
extra_scripts = pre:tools/pio_pc.py   ; en Windows añade ws2_32 (sockets)
; En el PC no se compila el código específico de la placa
build_src_filter =
    +<*>
    -<hal/esp32/>

; ---------------------------------------------------------------------
; CYD Freenove FNK0114F (2,8" ILI9341, táctil resistivo, ESP32 sin PSRAM)
; Placa provisional para probar mientras llega la FNK0104.
;
;   pio run -e cyd -t uploadfs   sube data_cyd/: base reducida, solo http
;                                (se genera con python tools/build_cyd.py)
;   pio run -e cyd -t upload     compila y flashea el programa
;   pio device monitor -e cyd    mensajes por el puerto serie
; ---------------------------------------------------------------------
[env:cyd]
platform = espressif32@6.12.0       ; la misma que en el contador de YouTube
board = esp32dev
framework = arduino
board_build.partitions = particiones_4mb.csv
board_build.filesystem = littlefs
extra_scripts = pre:tools/pio_cyd.py   ; sube data_cyd/ en vez de data/
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    ${env.build_flags}
    -D RADIO_ESP32
    -D PLACA_CYD
    -D LV_MEM_KB=32             ; sin PSRAM: el resto de la RAM es para WiFi y audio
    -D LINEAS_BUFER=10          ; búfer de dibujo de LVGL (líneas de pantalla)
    -D SIN_SD                   ; la SD gasta ~28 KB de RAM que necesita el audio
    -D SIN_HTTPS                ; el cifrado no cabe: no reanudar emisoras https
lib_deps =
    ${env.lib_deps}
    lovyan03/LovyanGFX@1.2.7
    ; 2.0.6: última versión para el core 2 de Arduino y con DAC interno
    https://github.com/schreibfaul1/ESP32-audioI2S.git#2.0.6
    tzapu/WiFiManager@2.0.17                      ; portal WiFi
    https://github.com/improv-wifi/sdk-cpp.git#v1.2.7   ; WiFi por USB al instalar
build_src_filter =
    +<*>
    -<hal/pc/>

; ---------------------------------------------------------------------
; Freenove FNK0104 (ESP32-S3, 8 MB de PSRAM, 16 MB de flash, 2,8" ILI9341
; con táctil capacitivo FT6336). Se conecta por el USB nativo del S3.
;
;   pio run -e fnk0104 -t uploadfs   sube la carpeta data/ (base completa)
;   pio run -e fnk0104 -t upload     compila y flashea el programa
;   pio device monitor -e fnk0104    mensajes por el puerto serie
;
; Pantalla, táctil, datos y audio (códec ES8311). LED WS2812 y SD, más
; adelante.
; ---------------------------------------------------------------------
[env:fnk0104]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi   ; PSRAM octal del ESP32-S3R8
board_build.partitions = particiones_16mb.csv
board_build.filesystem = littlefs
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    ${env.build_flags}
    -D RADIO_ESP32
    -D PLACA_FNK0104
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=1  ; Serial por el USB-C (no hay chip USB aparte)
    -D LV_MEM_KB=128
    -D SIN_SD                     ; la SD de esta placa va por SD_MMC: más adelante
lib_deps =
    ${env.lib_deps}
    lovyan03/LovyanGFX@1.2.7
    https://github.com/schreibfaul1/ESP32-audioI2S.git#2.0.6
    tzapu/WiFiManager@2.0.17                      ; portal WiFi
    https://github.com/improv-wifi/sdk-cpp.git#v1.2.7   ; WiFi por USB al instalar
build_src_filter =
    +<*>
    -<hal/pc/>
