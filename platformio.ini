; =====================================================================
; Radio Mundial ESP32 — configuración de PlatformIO
;
; Entornos:
;   pc     -> simulador en el ordenador (LVGL + SDL2, el ratón hace de dedo)
;   cyd    -> CYD Freenove FNK0114F (placa provisional, sin PSRAM)
;   fnk0104 -> placa Freenove FNK0104 (pendiente)
;
; Compilar y ejecutar el simulador:
;   pio run -e pc -t exec
; =====================================================================

[platformio]
default_envs = pc

; ---------------------------------------------------------------------
; Ajustes comunes a todos los entornos
; ---------------------------------------------------------------------
[env]
; LVGL 8.4.0: la misma versión que usan los ejemplos oficiales de Freenove
lib_deps =
    lvgl/lvgl@8.4.0
    bblanchon/ArduinoJson@7.2.1   ; lectura de regiones.json y emisoras
build_flags =
    -D LV_CONF_INCLUDE_SIMPLE   ; LVGL busca "lv_conf.h" en las rutas de include
    -D LV_LVGL_H_INCLUDE_SIMPLE ; las fuentes generadas incluyen "lvgl.h"
    -I include

; ---------------------------------------------------------------------
; Simulador en el PC
; Requisitos en Windows: MSYS2 con gcc y SDL2 (paquetes
; mingw-w64-ucrt-x86_64-gcc y mingw-w64-ucrt-x86_64-SDL2), y la carpeta
; C:\msys64\ucrt64\bin en el PATH.
; ---------------------------------------------------------------------
[env:pc]
platform = native
build_flags =
    ${env.build_flags}
    -D RADIO_PC                 ; marca que estamos compilando para el PC
    -D SDL_MAIN_HANDLED         ; usamos nuestro propio main()
    -lSDL2
extra_scripts = pre:tools/pio_pc.py   ; en Windows añade ws2_32 (sockets)
; En el PC no se compila el código específico de la placa
build_src_filter =
    +<*>
    -<hal/esp32/>

; ---------------------------------------------------------------------
; CYD Freenove FNK0114F (2,8" ILI9341, táctil resistivo, ESP32 sin PSRAM)
; Placa provisional para probar mientras llega la FNK0104.
;
;   pio run -e cyd -t uploadfs   sube la carpeta data/ (mapas y emisoras)
;   pio run -e cyd -t upload     compila y flashea el programa
;   pio device monitor -e cyd    mensajes por el puerto serie
; ---------------------------------------------------------------------
[env:cyd]
platform = espressif32@6.12.0       ; la misma que en el contador de YouTube
board = esp32dev
framework = arduino
board_build.partitions = particiones_4mb.csv
board_build.filesystem = littlefs
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    ${env.build_flags}
    -D RADIO_ESP32
    -D PLACA_CYD
lib_deps =
    ${env.lib_deps}
    lovyan03/LovyanGFX@1.2.7
    ; 2.0.6: última versión para el core 2 de Arduino y con DAC interno
    https://github.com/schreibfaul1/ESP32-audioI2S.git#2.0.6
build_src_filter =
    +<*>
    -<hal/pc/>

