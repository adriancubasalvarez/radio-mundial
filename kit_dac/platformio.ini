; Radio Mundial Boombox — kit de conexión FNK0104 -> DAC externo
;
; Dos firmwares pequeños para comprobar los cables antes de usar la radio:
;   identificar : pone a 3,3 V cada pin de audio por turnos (IO2, IO14, IO21)
;                 para saber qué color de cable es cada uno, con el polímetro.
;   tono        : manda tonos por I2S al DAC (izquierdo, derecho, los dos).
;                 Si suenan, los cables están bien.
;
; Flashear:   pio run -e identificar -t upload
;             pio run -e tono -t upload
; Ver mensajes: pio device monitor   (115200 baudios)

[env]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi   ; PSRAM octal del ESP32-S3R8
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1  ; Serial por el USB-C

[env:identificar]
build_src_filter = +<identificar.cpp> +<comun.h>

[env:tono]
build_src_filter = +<tono.cpp> +<comun.h>
