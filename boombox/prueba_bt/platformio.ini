; =====================================================================
; Radio Mundial Boombox — PRUEBA: altavoz Bluetooth (Fase A)
;
; ESP32 clásico (DevKit de 30 pines, ESP32-WROOM-32) + DAC PCM5102A
; (módulo WCMCU-5102) + amplificador TPA3116D2.
; Solo sirve para probar las cápsulas: el ESP32-S3 de la Freenove no
; tiene Bluetooth clásico (A2DP).
;
; Compilar y grabar (desde esta carpeta):
;   pio run -t upload
;   pio device monitor
; =====================================================================

[env:esp32dev]
platform = espressif32@6.12.0     ; la misma que el firmware principal
board = esp32dev
framework = arduino
; Bluetooth + WiFi ocupan mucho: partición grande para la aplicación
board_build.partitions = huge_app.csv
monitor_speed = 115200
lib_deps =
    https://github.com/pschatzmann/arduino-audio-tools.git#v1.3.0
    https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.12
